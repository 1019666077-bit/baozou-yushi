<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>期望构图示意图 · 非 Creator / 真机</title>
    <style>
      body {
        margin: 0;
        background: #140c04;
        color: #ffe9a8;
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      .banner {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 14px 18px;
        background: #3a2208;
        border-bottom: 3px dashed #f0c040;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .sub {
        display: block;
        margin-top: 6px;
        font-size: 14px;
        font-weight: 500;
        color: #ffd27a;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 18px 16px 40px;
      }
      figure {
        margin: 0 0 28px;
        padding: 12px;
        background: #1a1208;
        border: 2px solid #c48a20;
      }
      figcaption {
        margin: 0 0 10px;
        font-weight: 700;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border: 1px solid #8a5a10;
      }
      .mark {
        margin-top: 8px;
        color: #ffb4b4;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      期望构图 ≠ Creator / 真机 · 示意图禁止冒充实机
      <span class="sub"
        >下面三张是概念示意图，不是 Cocos 预览、不是 web-desktop、不是微信真机。真机 4 张请截进
        creator-shots/（当前为空是预期）。</span
      >
    </div>
    <main>
      <figure>
        <figcaption>expect_harbor_composition.jpg · 港口层次（示意）</figcaption>
        <img src="./expect_harbor_composition.jpg" alt="港口期望构图示意图，非 Creator 实机" />
        <p class="mark">水印已写「期望构图 · 示意图 · 非 Creator 实机」。不能顶替 01_harbor_wide.png。</p>
      </figure>
      <figure>
        <figcaption>expect_fish_five_parts.jpg · 鱼 5 件套（示意）</figcaption>
        <img src="./expect_fish_five_parts.jpg" alt="鱼五件套期望构图示意图，非 Creator 实机" />
        <p class="mark">水印已写「期望构图 · 示意图 · 非 Creator 实机」。不能顶替 03_bayfin_weak.png。</p>
      </figure>
      <figure>
        <figcaption>expect_cast_flop_cam.jpg · 抛竿翻扑（示意）</figcaption>
        <img src="./expect_cast_flop_cam.jpg" alt="抛竿翻扑期望构图示意图，非 Creator 实机" />
        <p class="mark">水印已写「期望构图 · 示意图 · 非 Creator 实机」。不能顶替 04_flop_smash.png。</p>
      </figure>
    </main>
  </body>
</html>
