<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出海钓鱼 · 灰盒预览</title>
  <style>
    html, body { margin: 0; background: #101820; color: #f6f3ea; }
    body { font-family: "WenQuanYi Micro Hei", "Droid Sans Fallback", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    #wrap { position: relative; width: 1280px; height: 720px; margin: 0 auto; }
    canvas { display: block; width: 1280px; height: 720px; }
    button {
      font-family: inherit;
      border: 2px solid #3ec8c0;
      background: #143848;
      color: #f6f3ea;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
    button.on { background: #ff8a20; color: #2a1608; border-color: #ffe0a8; }
    button:disabled { opacity: 0.45; cursor: default; }
    #hold {
      position: absolute;
      left: 390px;
      bottom: 28px;
      width: 500px;
      height: 88px;
      font-size: 30px;
      font-weight: 700;
      touch-action: none;
    }
    #back {
      position: absolute;
      right: 24px;
      top: 18px;
      width: 120px;
      height: 44px;
    }
    #bar {
      position: absolute;
      left: 16px;
      top: 64px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 760px;
    }
    #bar button { height: 42px; min-width: 92px; padding: 0 10px; }
    #shop {
      position: absolute;
      left: 70px;
      top: 250px;
      width: 520px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #shop button { height: 52px; text-align: left; padding: 0 14px; }
    #actions {
      position: absolute;
      right: 70px;
      top: 300px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #actions button { height: 64px; font-size: 22px; }
    #speed {
      position: absolute;
      left: 16px;
      bottom: 18px;
      width: 88px;
      height: 36px;
      font-size: 14px;
    }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="view" width="1280" height="720"></canvas>
    <div id="bar"></div>
    <div id="shop"></div>
    <div id="actions"></div>
    <button id="hold" type="button">按住抛竿</button>
    <button id="back" type="button">回港</button>
    <button id="speed" type="button">快进</button>
  </div>
  <script type="module" src="/preview.js"></script>
</body>
</html>
