<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>暴走鱼市 · 第一局体验代理</title>
    <style>
      :root {
        --stage-w: 1280px;
        --stage-h: 720px;
      }
      html,
      body {
        margin: 0;
        background: #071018;
        color: #f0faff;
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 12px 28px;
        box-sizing: border-box;
      }
      .disclaimer {
        width: min(var(--stage-w), 100%);
        margin-bottom: 8px;
        padding: 10px 14px;
        border: 2px dashed #f0c040;
        background: #2a1a08;
        color: #ffe9a8;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 0 0 3px rgba(58, 34, 8, 0.8);
      }
      .stage {
        position: relative;
        width: var(--stage-w);
        height: var(--stage-h);
        max-width: 100%;
        aspect-ratio: 1280 / 720;
        overflow: hidden;
        border-radius: 14px;
        border: 3px solid #d4a017;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 220, 140, 0.25);
        background: #0a3a4e;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #juice {
        pointer-events: none;
      }
      #hud,
      #buttons,
      #fx {
        position: absolute;
        inset: 0;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -50%);
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        font-weight: 700;
        text-shadow: 0 2px 0 rgba(20, 12, 4, 0.5), 0 0 12px rgba(8, 20, 28, 0.35);
        letter-spacing: 0.02em;
      }
      .label.title {
        font-weight: 800;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 0 rgba(40, 16, 0, 0.45), 0 0 16px rgba(255, 180, 64, 0.28);
      }
      .label.goldchip {
        font-weight: 800;
      }
      .label.wrap {
        white-space: normal;
        padding: 0;
        min-height: 0;
      }
      .plate {
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 16px;
        pointer-events: none;
        box-shadow: inset 0 1px 0 rgba(255, 226, 150, 0.32), 0 8px 22px rgba(0, 0, 0, 0.32);
      }
      .plate.plate-live {
        box-shadow: inset 0 1px 0 rgba(255, 230, 160, 0.45), 0 0 0 1px rgba(255, 210, 80, 0.28),
          0 10px 24px rgba(0, 0, 0, 0.36);
      }
      .progress {
        position: absolute;
        transform: translate(-50%, -50%);
        height: 16px;
        border-radius: 8px;
        background: rgba(8, 18, 26, 0.78);
        box-shadow: inset 0 0 0 1px rgba(255, 210, 80, 0.45), 0 4px 12px rgba(0, 0, 0, 0.28);
        overflow: hidden;
        pointer-events: none;
      }
      .progress > i {
        display: block;
        height: 100%;
        border-radius: 8px;
        background: linear-gradient(180deg, #ffe27a 0%, #ffb432 55%, #e88912 100%);
      }
      button.cta {
        position: absolute;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 18px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        letter-spacing: 0.03em;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      }
      button.cta.primary {
        font-weight: 800;
        text-shadow: 0 1px 0 rgba(255, 236, 200, 0.4), 0 2px 0 rgba(90, 32, 0, 0.35);
        box-shadow: 0 0 0 3px rgba(255, 228, 150, 0.95), 0 6px 0 #b85a10, 0 12px 18px rgba(0, 0, 0, 0.3),
          inset 0 10px 0 rgba(255, 236, 190, 0.28);
        animation: ctaPulse 1.15s ease-in-out infinite;
      }
      button.cta:active {
        transform: translate(-50%, calc(-50% + 2px));
      }
      @keyframes ctaPulse {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.12);
        }
      }
      .popup {
        position: absolute;
        transform: translate(-50%, -50%);
        color: #ffec78;
        font-weight: 800;
        pointer-events: none;
        text-shadow: 0 2px 0 #5a3a00;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        font-size: 13px;
        color: #c9dde6;
        opacity: 0.85;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="disclaimer" id="disclaimer">
        非 Cocos 实机，仅 2D 辅助体验代理。2D/辅助 ≠ Creator 3D。正在读取源码文案…
      </div>
      <div class="stage" id="stage" data-proxy="1">
        <canvas id="bg" width="1280" height="720"></canvas>
        <canvas id="juice" width="1280" height="720"></canvas>
        <div id="hud"></div>
        <div id="buttons"></div>
        <div id="fx"></div>
      </div>
    </div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
