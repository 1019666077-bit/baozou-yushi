<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>暴走鱼市 · 第一局体验代理</title>
    <style>
      :root {
        --stage-w: 1280px;
        --stage-h: 720px;
      }
      html,
      body {
        margin: 0;
        background: #071018;
        color: #f0faff;
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 12px 28px;
        box-sizing: border-box;
      }
      .disclaimer {
        width: min(var(--stage-w), 100%);
        margin-bottom: 8px;
        padding: 8px 12px;
        border: 1px dashed #d4a017;
        background: #1a1408;
        color: #ffe9a8;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .stage {
        position: relative;
        width: var(--stage-w);
        height: var(--stage-h);
        max-width: 100%;
        aspect-ratio: 1280 / 720;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        background: #0a3a4e;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #juice {
        pointer-events: none;
      }
      #hud,
      #buttons,
      #fx {
        position: absolute;
        inset: 0;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -50%);
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      }
      .label.wrap {
        white-space: normal;
        padding: 0;
        min-height: 0;
      }
      .plate {
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 12px;
        pointer-events: none;
      }
      button.cta {
        position: absolute;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 18px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      }
      button.cta.primary {
        box-shadow: 0 0 0 3px rgba(255, 236, 180, 0.9), 0 5px 0 rgba(0, 0, 0, 0.2);
      }
      button.cta:active {
        transform: translate(-50%, calc(-50% + 2px));
      }
      .popup {
        position: absolute;
        transform: translate(-50%, -50%);
        color: #ffec78;
        font-weight: 800;
        pointer-events: none;
        text-shadow: 0 2px 0 #5a3a00;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        font-size: 13px;
        color: #c9dde6;
        opacity: 0.85;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="disclaimer" id="disclaimer">
        非 Cocos 实机，仅体验代理。正在读取源码文案…
      </div>
      <div class="stage" id="stage" data-proxy="1">
        <canvas id="bg" width="1280" height="720"></canvas>
        <canvas id="juice" width="1280" height="720"></canvas>
        <div id="hud"></div>
        <div id="buttons"></div>
        <div id="fx"></div>
      </div>
    </div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
